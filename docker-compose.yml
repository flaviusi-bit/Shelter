services:
  postgres:
    image: postgres:16-alpine
    container_name: shelter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelter}
      POSTGRES_USER: ${POSTGRES_USER:-shelter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shelter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shelter} -d ${POSTGRES_DB:-shelter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: shelter-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shelter}
      DATABASE_USERNAME: ${POSTGRES_USER:-shelter}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SHELTER_ADMIN_USERNAME: ${SHELTER_ADMIN_USERNAME:-admin}
      SHELTER_ADMIN_DISPLAY_NAME: ${SHELTER_ADMIN_DISPLAY_NAME:-Shelter Administrator}
      SHELTER_ADMIN_PASSWORD: ${SHELTER_ADMIN_PASSWORD:-change-me-now}
      SHELTER_DOCUMENTS_PATH: /app/data/documents
      SHELTER_TIMEZONE: ${SHELTER_TIMEZONE:-Europe/Bucharest}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - shelter-documents-data:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shelter-postgres-data:
  shelter-documents-data:

# The backend image is built from backend/Dockerfile, including Maven compilation.
