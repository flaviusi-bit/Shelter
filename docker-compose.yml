services:
  postgres:
    image: postgres:16-alpine
    container_name: shelter-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shelter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: shelter-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SHELTER_ADMIN_USERNAME: ${SHELTER_ADMIN_USERNAME:-admin}
      SHELTER_ADMIN_DISPLAY_NAME: ${SHELTER_ADMIN_DISPLAY_NAME:-Shelter Administrator}
      SHELTER_ADMIN_PASSWORD: ${SHELTER_ADMIN_PASSWORD:?SHELTER_ADMIN_PASSWORD must be set}
      SHELTER_DOCUMENTS_PATH: /app/data/documents
      SHELTER_TIMEZONE: ${SHELTER_TIMEZONE:-Europe/Bucharest}
      SHELTER_BACKUP_PATH: /app/data/backups
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - shelter-documents-data:/app/data/documents
      - ${SHELTER_BACKUP_PATH:-./backups}:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shelter-postgres-data:
  shelter-documents-data:
