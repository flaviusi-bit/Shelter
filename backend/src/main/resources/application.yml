spring:
  application:
    name: shelter-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shelter}
    username: ${DATABASE_USERNAME:shelter}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

shelter:
  storage:
    documents-path: ${SHELTER_DOCUMENTS_PATH:./data/documents}

server:
  port: 8080
  tomcat:
    max-swallow-size: 25MB
